[package]
name = "eggsec-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Eggsec daemon runtime"
license.workspace = true

[[bin]]
name = "eggsec-daemon"
path = "src/main.rs"

[features]
default = []
http-api = ["dep:axum", "dep:async-stream", "dep:futures"]
# The GUI-serving daemon profile: the engine features a daemon that serves
# the desktop GUI enables. The list is owned by the engine
# (`eggsec::config::daemon_profile::DAEMON_SERVICE_PROFILE`) and pinned by
# `crates/eggsec/tests/feature_matrix.rs`.
#
# `cli` is a HOST GATE, not a CLI surface: it gates the engine's
# `runtime_bridge`, `commands`, and `dispatch` modules, which is where
# `EggsecRuntimeExecutor` lives. Without it the daemon cannot host the
# executor it is built around.
service = [
  "dep:eggsec",
  "eggsec/advanced-hunting",
  "eggsec/c2",
  "eggsec/cli",
  "eggsec/compliance",
  "eggsec/database",
  "eggsec/db-pentest",
  "eggsec/evasion",
  "eggsec/external-integrations",
  "eggsec/finding-workflow",
  "eggsec/headless-browser",
  "eggsec/nse",
  "eggsec/packet-inspection",
  "eggsec/postex",
  "eggsec/stress-testing",
  "eggsec/tool-api",
  "eggsec/vuln-management",
  "eggsec/web-proxy",
  "eggsec/websocket",
  "eggsec/wireless",
  "eggsec/wireless-advanced",
]
# Deprecated alias for `service`. Kept so every existing invocation and
# documentation reference keeps working; it now produces the profile daemon.
# The daemon's RUNTIME flag `--full-executor` is a different mechanism and
# is unaffected by this alias.
full-executor = ["service"]

[dependencies]
eggsec-runtime = { path = "../eggsec-runtime", version = "0.1.0" }
eggsec-daemon-protocol = { path = "../eggsec-daemon-protocol", version = "0.1.0" }
eggsec = { path = "../eggsec", version = "0.1.0", optional = true }
serde.workspace = true
serde_json.workspace = true
# Phase E WS3: daemon host (multi-thread server + net/io/sync/timers + select!).
# No fs/process/io-std; persistence goes through rusqlite, engine owns the rest.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal"] }
tokio-util = "0.7"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustc-hash.workspace = true
thiserror.workspace = true
uuid.workspace = true
anyhow.workspace = true
async-trait.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", optional = true }
async-stream = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "rustls-no-provider"], default-features = false }
eggsec = { path = "../eggsec", version = "0.1.0" }
# Test-only: lets the daemon's own tests compare the published operation
# description against the canonical catalog it claims to be read from.
eggsec-policy = { path = "../eggsec-policy", version = "0.1.0" }
# Test-only: exercises the desktop GUI's own client path — its client kind,
# its request-id namespace, and its `DesktopGuiManual` session — against a
# live daemon host over the real Unix socket.
eggsec-frontend-client = { path = "../eggsec-frontend-client", version = "0.1.0" }
# Ring provider for the reqwest test client (`rustls-no-provider` requires an
# explicitly installed process-level crypto provider).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
