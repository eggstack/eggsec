[package]
name = "eggsec-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Eggsec daemon runtime"
license.workspace = true

[[bin]]
name = "eggsec-daemon"
path = "src/main.rs"

[features]
default = []
http-api = ["dep:axum", "dep:async-stream", "dep:futures"]
# Full executor needs engine CLI types (`runtime_bridge` is cli-gated).
# Phase E WS2: engine default is empty, so enable `cli` explicitly here.
full-executor = ["dep:eggsec", "eggsec/cli"]

[dependencies]
eggsec-runtime = { path = "../eggsec-runtime", version = "0.1.0" }
eggsec-daemon-protocol = { path = "../eggsec-daemon-protocol", version = "0.1.0" }
eggsec = { path = "../eggsec", version = "0.1.0", optional = true }
serde.workspace = true
serde_json.workspace = true
# Phase E WS3: daemon host (multi-thread server + net/io/sync/timers + select!).
# No fs/process/io-std; persistence goes through rusqlite, engine owns the rest.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal"] }
tokio-util = "0.7"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror.workspace = true
uuid.workspace = true
anyhow.workspace = true
async-trait.workspace = true
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
axum = { version = "0.8", optional = true }
async-stream = { version = "0.3", optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "rustls-no-provider"], default-features = false }
eggsec = { path = "../eggsec", version = "0.1.0" }
# Ring provider for the reqwest test client (`rustls-no-provider` requires an
# explicitly installed process-level crypto provider).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
