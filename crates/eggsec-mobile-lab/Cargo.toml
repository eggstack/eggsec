[package]
name = "eggsec-mobile-lab"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Mobile app security analysis domain crate for Eggsec defense-lab security assessment"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["security", "mobile", "android", "ios", "defense-lab"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
# Shared types from core
eggsec-core = { path = "../eggsec-core", version = "0.1.0" }
# Report/evidence data contracts (Phase B: DTO-only, no rendering dependency)
eggsec-report-model = { path = "../eggsec-report-model", version = "0.1.0" }

# Serialization
serde = { workspace = true }
serde_json.workspace = true
toml = "0.8"

# Error handling
anyhow.workspace = true
thiserror.workspace = true

# Time
chrono.workspace = true

# Compression (evidence bundles)
flate2.workspace = true

# Async runtime (Phase E WS3: fs/io/net + spawn/time only)
tokio = { workspace = true, features = ["rt", "macros", "net", "fs", "io-util", "time"] }

# Tracing
tracing.workspace = true

# Fast hash maps (workspace convention)
rustc-hash.workspace = true

# ZIP parsing (APK/IPA). Only Stored and Deflated entries are read or
# written, so the unused compression backends stay out of the graph: zip's
# default `bzip2` feature pulls `libbz2-rs-sys`, whose `bzip2-1.0.6` licence
# expression is not on the `deny.toml` allow list, and adding a licence is a
# policy decision that milestone 015 does not own. `deflate` keeps both
# Stored/Deflated writing and Deflated reading; `time` keeps the archive
# timestamps exactly as they were (the writer stamps "now", not 1980-01-01).
zip = { version = "9", default-features = false, features = ["deflate", "time"] }

# iOS plist parsing
plist = { version = "1.7", features = ["serde"] }

# XML parsing (text AndroidManifest.xml fallback)
quick-xml = { version = "0.41", features = ["serialize"] }

# Regex (IPA secret pattern detection)
regex = { workspace = true }

# UUID (Frida script temp files)
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[features]
default = []
mobile-dynamic = []
