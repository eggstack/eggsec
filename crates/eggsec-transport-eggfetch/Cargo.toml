[package]
name = "eggsec-transport-eggfetch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Scope-aware outbound HTTP transport over eggfetch-core (production direct load-test backend; proxied routes pinned where enforceable)"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords = ["security", "http", "transport", "scope"]
categories = ["development-tools"]

[dependencies]
eggsec-transport = { workspace = true }
# Minimal eggfetch surface: H1/H2 ALPN + rustls + proxy-routing for pinned
# proxy peers/targets. `proxy` is required for both the SNI-direct connector
# path (pinned-IP URL + SNI = logical hostname for verified HTTPS) and
# pinned proxy routing. Deliberately NOT enabled: http3 (separate QUIC
# resolution path, no authorized binding story), cookies (jar semantics
# bypass per-hop authorization), compression codecs (bomb-limit parity),
# multipart. Requires eggfetch-core 0.2.0+ for direct
# `RequestBuilder::resolved_addresses` route reuse (logical URL + singular
# selected SocketAddr, Hyper-owned H1/H2 reuse), `Timeout.total` through
# response-body EOF, and `Proxy::resolved_addresses` +
# `RequestBuilder::proxy_target_addresses` (+ route/cache identity with
# pin state, SOCKS5H/plaintext fail-closed).
eggfetch-core = { version = "0.2.0", default-features = false, features = ["http1", "http2", "tls-rustls", "proxy"] }
bytes = { workspace = true }
http = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Phase E WS3: local-fixture parity suite (TcpListener/timeout/spawn + test).
tokio = { workspace = true, features = ["rt", "macros", "net", "time", "io-util", "sync"] }
ipnetwork = { workspace = true }
rcgen = { version = "0.14" }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Corrective 2026-09-19 WS1: deterministic loopback H2-over-TLS fixture only.
# Production adapter still owns no H2 server code; this is test-only and shares
# the transitive h2 0.4 line already pulled by hyper-rustls/hyper (no new
# production dependency, no second pool).
h2 = { version = "0.4" }
