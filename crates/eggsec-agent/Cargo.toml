[package]
name = "eggsec-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Agent coordination primitives for Eggsec"
authors.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords = ["agent", "coordination", "security", "distributed"]
categories = ["development-tools"]

[dependencies]
eggsec-core = { path = "../eggsec-core", version = "0.1.0" }
eggsec-transport = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
# Phase E WS3: task lifecycle only (spawn/sync/time + macros for select!/test).
# No net/fs/process/signal/io-std; transport goes through `eggsec-transport`.
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
rustc-hash = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
eggsec-transport = { workspace = true, features = ["test-util"] }
