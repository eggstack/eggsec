# Cargo deny configuration for Eggsec — canonical dependency-policy source.
# Run locally with: make check-deps
# CI gate: .github/workflows/ci.yml `dependency-policy` job (PRs + main).
# `cargo audit` is diagnostic only (see docs/DEPENDENCY_EXCEPTIONS.md); it must
# not suppress advisories beyond this file. `.cargo/audit.toml` was removed in
# Phase F — do not reintroduce historical ignores "just in case".

[graph]
# Cover optional-feature dependency closures (pdf, db-pentest, mssql, nse-ssh2).
# Default-feature-only checks hide real advisories (e.g. lopdf via printpdf,
# sqlx/rsa via db-pentest). The check-deps target always passes
# --workspace --all-features; this section documents that intent for readers.
all-features = true

[advisories]
db-path = "advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "transitive"
unsound = "transitive"

# Dependency advisory exceptions — reviewed 2026-09-13 (Phase F).
# Cargo Deny is the canonical policy source; each ignore links to the full
# record in docs/DEPENDENCY_EXCEPTIONS.md (advisory ID, path, feature, API use,
# exploitability, compensating control, owner, created/review-by, blocker).
ignore = [
    # --- Transitive: unmaintained crates with no upstream fix ---
    { id = "RUSTSEC-2025-0057", reason = "fxhash unmaintained; transitive via selectors->scraper (recon/js, nse/httpspider). Internal hash map, not exposed. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2024-0384", reason = "instant unmaintained; transitive via notify-types->notify v7 (file watching). Internal timing shim, not exposed. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile unmaintained; transitive via rustls-native-certs->tiberius (mssql marker only). Thin wrapper over rustls-pki-types, no vuln. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; transitive via owned_ttf_parser->printpdf (pdf feature, generation-only, builtin Helvetica, never parses untrusted fonts). See docs/DEPENDENCY_EXCEPTIONS.md." },
    # --- Vulnerabilities with no safe upgrade or blocked upgrade ---
    { id = "RUSTSEC-2026-0187", reason = "lopdf stack overflow via nested PDF objects; transitive via printpdf v0.7 (pdf feature, generation-only, never parses untrusted PDFs). Upgrade to printpdf>=0.8/lopdf>=0.42 is a breaking major bump. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing sidechannel; transitive via sqlx-mysql (db-pentest lab-only, operator-initiated connections to authorized targets). No fixed upgrade available. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki CRL panic; transitive via rustls 0.21->tokio-rustls 0.24->tiberius (mssql marker only, lab-only TLS to authorized servers). tiberius 0.13.0 upgrades to rustls 0.23/webpki 0.103 but pulls tokio-rustls with default features, enabling the aws-lc-rs provider that [bans] deny forbids (ring-only TLS). Blocked by policy, not by upstream. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki wildcard name-constraint bypass; same tiberius path as RUSTSEC-2026-0104. Requires misissued certs; lab-only. tiberius 0.13.0 upgrades to rustls 0.23/webpki 0.103 but pulls tokio-rustls with default features, enabling the aws-lc-rs provider that [bans] deny forbids (ring-only TLS). Blocked by policy, not by upstream. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki URI name-constraint bypass; same tiberius path as RUSTSEC-2026-0104. Library has no URI-name API; lab-only. tiberius 0.13.0 upgrades to rustls 0.23/webpki 0.103 but pulls tokio-rustls with default features, enabling the aws-lc-rs provider that [bans] deny forbids (ring-only TLS). Blocked by policy, not by upstream. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2026-0346", reason = "rustls 0.21 Debug session secrets via tiberius (db-pentest-mssql marker). Custom ClientSessionStore Debug not used; lab-only TLS to authorized MSSQL. Same tiberius/aws-lc-rs upgrade blocker as RUSTSEC-2026-0104. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2026-0349", reason = "rustls 0.21 unauthenticated ServerHello key-share downgrade via tiberius (db-pentest-mssql marker). Lab-only operator connections; same tiberius upgrade blocker. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.101.7 distrusted emSign intermediates on tiberius rustls 0.21 path (db-pentest-mssql marker). Patched in 0.103.16+ on rustls 0.23 only; tiberius upgrade blocked by ring-only TLS policy. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2026-0385", reason = "ctutils non-constant-time Choice masks via curve25519-dalek 5 -> ed25519-dalek 3 (template signature verify). Verification-only, no local secret generation on attacker-controlled timing paths. Await ctutils/curve25519 fix. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys bundled SQLite <3.54 via rusqlite 0.32 (daemon session store). Local crafted WAL/page-size attack; daemon DB is operator-local. rusqlite 0.41/libsqlite3-sys 0.39 blocked by sqlx linking policy until coordinated upgrade. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained via serde_yaml_neo (web-proxy/engine YAML). Operator-supplied config only; no untrusted YAML ingestion. See docs/DEPENDENCY_EXCEPTIONS.md." },
    # --- GUI shell advisory exceptions (desktop-gui-frontend milestone 015) ---
    { id = "RUSTSEC-2024-0429", reason = "glib 0.18.5 unsound; transitive via gtk 0.18->tauri 2.11.6 shell closure (eggsec-gui, Linux only). Upgrade to glib>=0.20.0 is unreachable: no published muda/tao/wry version uses gtk-rs 0.20+, and tauri 2.12.5 still requires gtk ^0.18. Blocked by upstream, not by repo policy. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 unmaintained; transitive via gtk3-macros 0.18.2 and glib-macros 0.18.5 (gtk-rs 0.18 stack in the eggsec-gui shell closure). 1.0.4 is the latest published version; the gtk-rs 0.20+ macro crates do not depend on it, so this clears with RUSTSEC-2024-0429. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident 0.9.0 unmaintained; transitive via urlpattern 0.3.0->tauri-utils 2.9.3 (eggsec-gui shell closure). urlpattern 0.6.0 drops the unic-* set, but tauri-utils 2.10.x requires urlpattern ^0.6 and declares MSRV 1.90, above the workspace 1.89 floor. Blocked by the MSRV floor, not by upstream. See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2025-0075", reason = "unic-char-range 0.9.0 unmaintained; same urlpattern 0.3.0->tauri-utils 2.9.3 path as RUSTSEC-2025-0100. Clears with urlpattern 0.6.0, which requires tauri-utils 2.10.x (MSRV 1.90, above the workspace 1.89 floor). See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2025-0080", reason = "unic-common 0.9.0 unmaintained; same urlpattern 0.3.0->tauri-utils 2.9.3 path as RUSTSEC-2025-0100. Clears with urlpattern 0.6.0, which requires tauri-utils 2.10.x (MSRV 1.90, above the workspace 1.89 floor). See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2025-0081", reason = "unic-char-property 0.9.0 unmaintained; same urlpattern 0.3.0->tauri-utils 2.9.3 path as RUSTSEC-2025-0100. Clears with urlpattern 0.6.0, which requires tauri-utils 2.10.x (MSRV 1.90, above the workspace 1.89 floor). See docs/DEPENDENCY_EXCEPTIONS.md." },
    { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version 0.9.0 unmaintained; same urlpattern 0.3.0->tauri-utils 2.9.3 path as RUSTSEC-2025-0100. Clears with urlpattern 0.6.0, which requires tauri-utils 2.10.x (MSRV 1.90, above the workspace 1.89 floor). See docs/DEPENDENCY_EXCEPTIONS.md." },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
# Per-crate license exceptions (Phase F). Prefer allow-list additions for
# permissive licenses; use exceptions only for scope-limited copyleft that
# cannot be upgraded away. Each entry is documented in
# docs/DEPENDENCY_EXCEPTIONS.md with owner and review-by date.
exceptions = [
    # auto_generate_cdp is a build-time codegen tool for headless_chrome
    # (headless-browser feature, lab-only DOM XSS/SPA crawling). GPL-3.0-or-later
    # comes from its LICENSE.txt (no Cargo license field). It runs at build
    # time only and is not linked into shipped binaries.
    { allow = ["GPL-3.0-or-later"], crate = "auto_generate_cdp" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = ["aws-lc-rs"]

[sources]
# Fail closed for unexpected registries/git sources (Phase F WS3).
# crates.io is the default allowed registry; no custom registries are used.
# The extracted NSE runtime was a temporary exact-rev Git source during
# Milestone 003; since Milestone 004 Eggsec consumes the published
# `eggsec-nse` crates.io release and no Git source is allowed.
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
