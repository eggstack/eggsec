[workspace]
members = [
    "crates/eggsec-core",
    "crates/eggsec",
    "crates/eggsec-tui",
    "crates/eggsec-cli",
    "crates/eggsec-output",
    "crates/eggsec-report-model",
    "crates/eggsec-tool-core",
    "crates/eggsec-agent",
    "crates/eggsec-db-lab",
    "crates/eggsec-web-proxy",
    "crates/eggsec-mobile-lab",
    "crates/eggsec-runtime",
    "crates/eggsec-daemon",
    "crates/eggsec-daemon-protocol",
    "crates/eggsec-ui-model",
    "crates/eggsec-python",
    "crates/eggsec-transport",
    "crates/eggsec-transport-eggfetch",
    "crates/eggsec-policy",
    "crates/eggsec-service-db",
    "crates/eggsec-secrets",
    "crates/eggsec-payloads",
    "crates/eggsec-udp-scan",
    "crates/eggsec-frontend-client",
    "crates/eggsec-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["David Bowman"]
repository = "https://github.com/eggstack/eggsec"
homepage = "https://github.com/eggstack/eggsec"
documentation = "https://github.com/eggstack/eggsec#readme"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# Phase E WS3: narrowest safe workspace baseline (no features). Each crate
# declares only the Tokio capabilities it uses via
# `tokio = { workspace = true, features = [...] }`. `test-util` is enabled
# nowhere (no paused-time call sites).
tokio = { version = "1", default-features = false }
parking_lot = "0.12"
rand = { version = "0.8", features = ["std_rng"] }
base64 = "0.23"
flate2 = "1"
url = "2"
urlencoding = "2.1"
regex = "1"
hostname = "0.4"
hex = "0.4"
md-5 = "0.10"
sha1 = "0.10"
dashmap = "6"
rustc-hash = "2"
scraper = "0.21"
ipnetwork = { version = "0.21", features = ["serde"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
chrono-tz = "0.10"
unicode-normalization = "0.1"
lru = "0.18"
uuid = { version = "1", features = ["v4", "serde"] }
# JSON Schema derivation for the canonical request DTOs (ADR-0008). `derive`
# only — the chrono/uuid/url/... integrations are not used by eggsec's
# request structs, and `default-features = false` keeps them out of the graph.
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
eggsec-daemon-protocol = { path = "crates/eggsec-daemon-protocol", version = "0.1.0" }
bytes = "1"
http = "1"
eggsec-transport = { path = "crates/eggsec-transport", version = "0.1.0" }
eggsec-transport-eggfetch = { path = "crates/eggsec-transport-eggfetch", version = "0.1.0" }
eggsec-udp-scan = { path = "crates/eggsec-udp-scan", version = "0.1.0" }
eggsec-frontend-client = { path = "crates/eggsec-frontend-client", version = "0.1.0" }

# Desktop GUI shell (ADR-0009). Every pin below is EXACT (`=`), not a caret:
# the Tauri 2.12 / tauri-utils 2.10 / tauri-macros 2.7 lines all declare
# MSRV 1.90, which is above this workspace's 1.89 floor. `tauri` declares its
# runtime and utils dependencies with caret requirements, so without these
# pins a `cargo update` would float the closure onto the 1.90 line and break
# `make check-msrv`. The GUI crate depends on each of these directly for that
# reason — they hold the transitive closure on the MSRV-safe line.
tauri = { version = "=2.11.6", default-features = false }
tauri-build = { version = "=2.6.3" }
tauri-runtime = { version = "=2.11.3" }
tauri-runtime-wry = { version = "=2.11.4" }
tauri-macros = { version = "=2.6.3" }
tauri-utils = { version = "=2.9.3" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.test]
opt-level = 1
