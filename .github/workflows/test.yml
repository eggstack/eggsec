name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  python-tests:
    name: Python Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default-wheel
            features: ""
          - name: nse
            features: "nse"
          - name: db-pentest
            features: "db-pentest"
          - name: web-proxy
            features: "web-proxy"
          - name: mobile
            features: "mobile"
          - name: headless-browser
            features: "headless-browser"
          - name: daemon-client
            features: "daemon-client"
          - name: packet-inspection
            features: "packet-inspection"
          - name: stress-testing
            features: "stress-testing"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create virtualenv
        run: python -m venv .venv && source .venv/bin/activate && echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
      - name: Install maturin
        run: source $PWD/.venv/bin/activate && pip install maturin pytest pytest-timeout
      - name: Build wheel
        working-directory: crates/eggsec-python
        run: |
          source $GITHUB_WORKSPACE/.venv/bin/activate
          if [ -n "${{ matrix.features }}" ]; then
            maturin develop --features "${{ matrix.features }}"
          else
            maturin develop
          fi
      - name: Run tests
        working-directory: crates/eggsec-python
        run: source $GITHUB_WORKSPACE/.venv/bin/activate && pytest tests/ -v -q --tb=short --timeout=60 --junitxml=test-results-${{ matrix.name }}.xml
        env:
          EGGSEC_ALLOW_LOOPBACK_FIXTURE: "1"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results-${{ matrix.name }}
          path: crates/eggsec-python/test-results-${{ matrix.name }}.xml
          retention-days: 30
      - name: Run validation scripts
        if: matrix.name == 'default-wheel'
        run: |
          sudo apt-get update && sudo apt-get install -y ripgrep
          source $GITHUB_WORKSPACE/.venv/bin/activate && bash scripts/check-architecture-guards.sh

  python-capability-matrix:
    name: Python capability matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create virtualenv
        run: python -m venv .venv && source .venv/bin/activate && echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
      - name: Build default wheel
        working-directory: crates/eggsec-python
        run: source $GITHUB_WORKSPACE/.venv/bin/activate && pip install maturin && maturin develop
      - name: Check capability matrix
        run: source $PWD/.venv/bin/activate && python scripts/check-python-capability-matrix.py

  python-architecture-guards:
    name: Python architecture guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create virtualenv
        run: python -m venv .venv && source .venv/bin/activate && echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
      - name: Build default wheel
        working-directory: crates/eggsec-python
        run: source $GITHUB_WORKSPACE/.venv/bin/activate && pip install maturin && maturin develop
      - name: Check architecture guards
        run: source $PWD/.venv/bin/activate && python scripts/check-python-architecture-guards.py

  python-stub-parity:
    name: Python stub parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create virtualenv
        run: python -m venv .venv && source .venv/bin/activate && echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
      - name: Build default wheel
        working-directory: crates/eggsec-python
        run: source $GITHUB_WORKSPACE/.venv/bin/activate && pip install maturin && maturin develop
      - name: Check stub parity
        run: source $PWD/.venv/bin/activate && python scripts/check_python_stub_parity.py

  python-type-check:
    name: Python type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create virtualenv
        run: python -m venv .venv && source .venv/bin/activate && echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
      - name: Build default wheel
        working-directory: crates/eggsec-python
        run: source $GITHUB_WORKSPACE/.venv/bin/activate && pip install maturin && maturin develop
      - name: Install type checkers
        run: source $PWD/.venv/bin/activate && pip install mypy pyright
      - name: Run type checks
        run: source $PWD/.venv/bin/activate && bash scripts/check_python_types.sh

  python-maturity-consistency:
    name: Python maturity consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create virtualenv
        run: python -m venv .venv && source .venv/bin/activate && echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
      - name: Build default wheel
        working-directory: crates/eggsec-python
        run: source $GITHUB_WORKSPACE/.venv/bin/activate && pip install maturin && maturin develop
      - name: Check maturity consistency
        run: source $PWD/.venv/bin/activate && python scripts/check-python-capability-matrix.py --check-maturity

  python-feature-metadata:
    name: Python feature metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create virtualenv
        run: python -m venv .venv && source .venv/bin/activate && echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
      - name: Build default wheel
        working-directory: crates/eggsec-python
        run: source $GITHUB_WORKSPACE/.venv/bin/activate && pip install maturin && maturin develop
      - name: Check feature metadata
        run: source $PWD/.venv/bin/activate && python scripts/check-python-architecture-guards.py --check-feature-metadata

  python-profile-manifest:
    name: Python profile manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate profile manifest
        run: python scripts/validate_python_profiles.py --manifest crates/eggsec-python/validation/profiles.json

  python-evidence-bundle:
    name: Python evidence bundle
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Create virtualenv
        run: python -m venv .venv && source .venv/bin/activate && echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
      - name: Build default wheel
        working-directory: crates/eggsec-python
        run: source $GITHUB_WORKSPACE/.venv/bin/activate && pip install maturin && maturin develop
      - name: Build wheel file
        working-directory: crates/eggsec-python
        run: source $GITHUB_WORKSPACE/.venv/bin/activate && maturin build --out $GITHUB_WORKSPACE/target/python-wheels
      - name: Download default-wheel test results
        uses: actions/download-artifact@v4
        with:
          name: python-test-results-default-wheel
          path: /tmp/test-results/
      - name: Prepare test results
        run: |
          mkdir -p crates/eggsec-python/python
          echo "Contents of /tmp/test-results/:"
          find /tmp/test-results/ -type f 2>/dev/null || echo "  (empty or missing)"
          FOUND_XML=$(find /tmp/test-results/ -type f -name '*.xml' 2>/dev/null | head -1)
          if [ -n "$FOUND_XML" ]; then
            echo "Copying $FOUND_XML -> crates/eggsec-python/python/test-results.xml"
            cp "$FOUND_XML" crates/eggsec-python/python/test-results.xml
          else
            echo "WARNING: No JUnit XML found in /tmp/test-results/"
          fi
      - name: Generate evidence bundle
        run: source $PWD/.venv/bin/activate && python scripts/build_python_release_evidence.py --commit "${{ github.sha }}"
      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-evidence-bundle
          path: target/python-validation/
          retention-days: 90

  python-maturity-guard:
    name: Python maturity guard
    runs-on: ubuntu-latest
    needs: [python-evidence-bundle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Create virtualenv
        run: python -m venv .venv && source .venv/bin/activate && echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
      - name: Build default wheel
        working-directory: crates/eggsec-python
        run: source $GITHUB_WORKSPACE/.venv/bin/activate && pip install maturin && maturin develop
      - name: Build wheel file
        working-directory: crates/eggsec-python
        run: source $GITHUB_WORKSPACE/.venv/bin/activate && maturin build --out $GITHUB_WORKSPACE/target/python-wheels
      - name: Download default-wheel test results
        uses: actions/download-artifact@v4
        with:
          name: python-test-results-default-wheel
          path: /tmp/test-results/
      - name: Prepare test results
        run: |
          mkdir -p crates/eggsec-python/python
          echo "Contents of /tmp/test-results/:"
          find /tmp/test-results/ -type f 2>/dev/null || echo "  (empty or missing)"
          FOUND_XML=$(find /tmp/test-results/ -type f -name '*.xml' 2>/dev/null | head -1)
          if [ -n "$FOUND_XML" ]; then
            echo "Copying $FOUND_XML -> crates/eggsec-python/python/test-results.xml"
            cp "$FOUND_XML" crates/eggsec-python/python/test-results.xml
          else
            echo "WARNING: No JUnit XML found in /tmp/test-results/"
          fi
      - name: Generate evidence bundle
        run: source $PWD/.venv/bin/activate && python scripts/build_python_release_evidence.py --commit "${{ github.sha }}"
      - name: Run maturity guard
        run: source $PWD/.venv/bin/activate && python scripts/check_maturity_guard.py

  python-skip-budget:
    name: Python skip budget
    runs-on: ubuntu-latest
    needs: [python-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Create virtualenv
        run: python -m venv .venv && source .venv/bin/activate && echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
      - name: Build default wheel
        working-directory: crates/eggsec-python
        run: source $GITHUB_WORKSPACE/.venv/bin/activate && pip install maturin && maturin develop
      - name: Download default-wheel test results
        uses: actions/download-artifact@v4
        with:
          name: python-test-results-default-wheel
          path: /tmp/test-results/
      - name: Enforce skip budgets
        run: |
          JUNIT_XML=$(find /tmp/test-results/ -name 'test-results-default-wheel.xml' | head -1)
          if [ -n "$JUNIT_XML" ] && [ -f "$JUNIT_XML" ]; then
            python scripts/python_skip_budget.py \
              --profile default-wheel \
              --manifest crates/eggsec-python/validation/profiles.json \
              --junit-xml "$JUNIT_XML"
          else
            echo "ERROR: No JUnit XML found — budget enforcement requires test results"
            find /tmp/test-results/ -type f || echo "Directory empty or missing"
            exit 1
          fi

  python-release-gate:
    name: Python release gate
    if: always()
    needs: [
      python-capability-matrix,
      python-architecture-guards,
      python-stub-parity,
      python-type-check,
      python-maturity-consistency,
      python-feature-metadata,
      python-profile-manifest,
      python-evidence-bundle,
      python-maturity-guard,
      python-skip-budget,
    ]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        run: |
          echo "Python release gate evaluation:"
          echo "  python-capability-matrix: ${{ needs.python-capability-matrix.result }}"
          echo "  python-architecture-guards: ${{ needs.python-architecture-guards.result }}"
          echo "  python-stub-parity: ${{ needs.python-stub-parity.result }}"
          echo "  python-type-check: ${{ needs.python-type-check.result }}"
          echo "  python-maturity-consistency: ${{ needs.python-maturity-consistency.result }}"
          echo "  python-feature-metadata: ${{ needs.python-feature-metadata.result }}"
          echo "  python-profile-manifest: ${{ needs.python-profile-manifest.result }}"
          echo "  python-evidence-bundle: ${{ needs.python-evidence-bundle.result }}"
          echo "  python-maturity-guard: ${{ needs.python-maturity-guard.result }}"
          echo "  python-skip-budget: ${{ needs.python-skip-budget.result }}"

          FAILED=0
          for result in \
            "${{ needs.python-capability-matrix.result }}" \
            "${{ needs.python-architecture-guards.result }}" \
            "${{ needs.python-stub-parity.result }}" \
            "${{ needs.python-type-check.result }}" \
            "${{ needs.python-maturity-consistency.result }}" \
            "${{ needs.python-feature-metadata.result }}" \
            "${{ needs.python-profile-manifest.result }}" \
            "${{ needs.python-evidence-bundle.result }}" \
            "${{ needs.python-maturity-guard.result }}" \
            "${{ needs.python-skip-budget.result }}"; do
            if [ "$result" != "success" ]; then
              echo "FAILED: required job result was '$result' (expected 'success')"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::Python release gate failed: one or more required guards did not succeed"
            exit 1
          fi

          echo "All required Python guards passed."

  release-gate:
    name: Release gate
    if: always()
    needs: [
      python-release-gate,
    ]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate release gate
        run: |
          echo "Release gate evaluation:"
          echo "  python-release-gate: ${{ needs.python-release-gate.result }}"

          if [ "${{ needs.python-release-gate.result }}" != "success" ]; then
            echo "FAILED: required job result was '${{ needs.python-release-gate.result }}' (expected 'success')"
            exit 1
          fi

          echo "All required release gates passed."
