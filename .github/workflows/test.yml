name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Create virtualenv
        run: python -m venv .venv && source .venv/bin/activate && echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
      - name: Install dependencies
        run: source $PWD/.venv/bin/activate && pip install --upgrade pip && pip install maturin pytest pytest-timeout mypy pyright
      - name: Build extension
        working-directory: crates/eggsec-python
        run: source $GITHUB_WORKSPACE/.venv/bin/activate && maturin develop
      - name: Behavioral tests
        working-directory: crates/eggsec-python
        run: source $GITHUB_WORKSPACE/.venv/bin/activate && EGGSEC_ALLOW_LOOPBACK_FIXTURE=1 pytest tests/ python/tests/ --timeout=60 --tb=short -q
      - name: Capability matrix
        run: source $PWD/.venv/bin/activate && python scripts/check-python-capability-matrix.py
      - name: Architecture guards
        run: source $PWD/.venv/bin/activate && python scripts/check-python-architecture-guards.py
      - name: Stub parity
        run: source $PWD/.venv/bin/activate && python scripts/check_python_stub_parity.py
      - name: Type checks
        run: source $PWD/.venv/bin/activate && bash scripts/check_python_types.sh
